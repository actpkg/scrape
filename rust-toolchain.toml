# Pinned to match the engine fork: Servo's crates are built against this and use
# nightly features on it through RUSTC_BOOTSTRAP (see .cargo/config.toml).
# 1.100.0-beta per user directive (2026-11-02): newer than the engine fork's
# 1.95.0 pin; the fork's nightly features still compile through
# RUSTC_BOOTSTRAP. wasip3 declared alongside wasip2 — the engine itself is
# wasip2-only today; the target list keeps the follow-up port buildable here.
#
# WASIP2 RELEASE BUILDS MUST OVERRIDE THE CHANNEL AT INVOCATION:
#     cargo +1.95.0 build --target wasm32-wasip2 --release
# (wasip3 release builds run on this channel directly: +1.100.0-beta.)
# rust-lld in 1.100.0-beta.7 mis-links the mozjs_sys prebuilt objects (two
# `function signature mismatch` warnings in the Unified_cpp objects) and the
# mis-applied data segments trip a MOZ_RELEASE_ASSERT in the engine's first
# static constructor — every guest call traps in InitializeUptime. The
# engine fork's own 1.95.0 pin is load-bearing: on it the binary runs and
# the whole e2e suite passes. Revisit when rust-lld lands the fix.
[toolchain]
channel = "1.100.0-beta"
targets = ["wasm32-wasip2", "wasm32-wasip3"]
