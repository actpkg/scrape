[package]
name = "component-scrape"
description = "Render a web page — SPA included — with the Servo engine and return GitHub-Flavored Markdown plus page metadata"
# This is the component's own version, not the engine's. The engine version it
# was built against is recorded in the README. Keep in sync with components/servo.
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
keywords = ["act", "scrape", "markdown", "servo", "wasm"]
repository = "https://github.com/actpkg/scrape"

# The conversion pipeline compiles on the host too — its unit tests run there
# (`cargo test --target x86_64-unknown-linux-gnu`).
[dependencies]
htmd = "0.5"
readabilityrs = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
act-sdk = "0.14"

# The engine: Servo ported to wasm32-wasip2. It does not compile on the host,
# so it — and everything only it uses — is gated to wasm builds. Same git dep
# and the same fork set as components/servo; keep the two in sync.
[target.'cfg(target_arch = "wasm32")'.dependencies]
servo = { git = "https://github.com/GamePad64/servo", branch = "wasip2-port-v0.5.0", default-features = false, features = [
    "js_jit",
    "baked-in-resources",
] }
# Referenced explicitly so the linker keeps it: the resource reader registers
# itself through `inventory`, and a crate nothing names is dropped.
servo-default-resources = { git = "https://github.com/GamePad64/servo", branch = "wasip2-port-v0.5.0" }
tokio = { version = "1.53", features = ["rt", "time", "macros", "net", "io-util"] }
base64 = "0.23"
log = "0.4"

# The engine's forks. `[patch]` applies from the workspace being built, not from
# a dependency's own workspace, so this list is repeated here — without it Cargo
# resolves these from crates.io and the build fails on the threads and platform
# backends a wasm guest does not have.
# Verbatim from components/servo/Cargo.toml — keep in sync with it and with
# servo-wasi/Cargo.toml.
[patch.crates-io]
webrender = { git = "https://github.com/GamePad64/webrender", branch = "wasip2" }
webrender_api = { git = "https://github.com/GamePad64/webrender", branch = "wasip2" }
wr_glyph_rasterizer = { git = "https://github.com/GamePad64/webrender", branch = "wasip2" }
# Same repo, and they have to come from it too: the crates inside webrender
# depend on these by path, so leaving them on crates.io puts two versions of each
# in the graph and the trait impls stop matching.
wr_malloc_size_of = { git = "https://github.com/GamePad64/webrender", branch = "wasip2" }
webrender_build = { git = "https://github.com/GamePad64/webrender", branch = "wasip2" }
ipc-channel = { git = "https://github.com/GamePad64/ipc-channel", branch = "wasip2" }
surfman = { git = "https://github.com/GamePad64/surfman", branch = "wasip2" }
imsz = { git = "https://github.com/GamePad64/imsz", branch = "wasip2" }
freetype-sys = { git = "https://github.com/GamePad64/freetype-sys", branch = "wasip2" }

[lib]
crate-type = ["cdylib", "rlib"]
